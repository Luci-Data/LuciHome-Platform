<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<div class="beta-banner"><i class="fa-solid fa-flask"></i>LuciHome is in Beta / Early Access — the platform is not yet officially launched.</div>
<script>
(function(){
  function setBetaBannerHeight(){
    var b = document.querySelector('.beta-banner');
    if (b) document.documentElement.style.setProperty('--beta-banner-h', b.offsetHeight + 'px');
  }
  setBetaBannerHeight();
  window.addEventListener('resize', setBetaBannerHeight);
})();
</script>

<header class="topbar public-topbar">
  <div class="topbar-brand">
    <a href="index.html" style="display:flex;align-items:center;gap:12px;text-decoration:none">
      <div class="mark">L</div>
      <div class="wordmark">LuciHome</div>
    </a>
  </div>
</header>

<main class="section-wrap" style="max-width:520px;text-align:center;padding-top:80px">
  <i class="fa-solid fa-house-circle-exclamation" style="font-size:44px;color:var(--accent);margin-bottom:18px;display:block"></i>
  <h1 style="font-family:var(--font-display);font-weight:500;font-size:24px;margin:0 0 8px">Page not found</h1>
  <p style="color:var(--text-secondary);margin:0 0 24px">The page you're looking for doesn't exist or may have moved.</p>
  <a href="index.html" class="btn-primary" style="display:inline-flex"><i class="fa-solid fa-house"></i> Back to LuciHome</a>
</main>
